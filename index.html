<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster Pro</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-amber: #fbbf24;
      --border-color: #475569;
      --radius: 10px;
    }

    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-secondary: #ffffff;
      --bg-card: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-amber: #d97706;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
      flex: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
    }

    .stat-card .number {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .controls-panel {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .task-form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .task-form input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      outline: none;
    }

    .task-form select {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
    }

    button.btn-primary {
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
    }

    button.btn-primary:hover {
      opacity: 0.9;
    }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .filter-btn.active {
      background-color: var(--bg-card);
      color: var(--accent-blue);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-item {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
    }

    .task-checkbox {
      width: 1.2rem;
      height: 1.2rem;
      cursor: pointer;
      accent-color: var(--accent-blue);
    }

    .task-text {
      font-size: 1rem;
      word-break: break-word;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-high { background-color: rgba(248, 113, 113, 0.2); color: var(--accent-red); }
    .badge-medium { background-color: rgba(251, 191, 36, 0.2); color: var(--accent-amber); }
    .badge-low { background-color: rgba(74, 222, 128, 0.2); color: var(--accent-green); }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 4px;
    }

    .delete-btn:hover {
      color: var(--accent-red);
      background-color: var(--bg-card);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      background-color: var(--bg-secondary);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡</span> TaskMaster
    </div>
    <button class="theme-toggle-btn" id="themeToggle">
      <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
    </button>
  </header>

  <main class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div>Total Tasks</div>
        <div class="number" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div>Pending</div>
        <div class="number" style="color: var(--accent-amber);" id="statPending">0</div>
      </div>
      <div class="stat-card">
        <div>Completed</div>
        <div class="number" style="color: var(--accent-green);" id="statCompleted">0</div>
      </div>
    </div>

    <section class="controls-panel">
      <form class="task-form" id="taskForm">
        <input type="text" id="taskInput" placeholder="Add a new task..." required autocomplete="off">
        <select id="prioritySelect">
          <option value="low">Low Priority</option>
          <option value="medium" selected>Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        <button type="submit" class="btn-primary">Add Task</button>
      </form>

      <div class="filter-bar">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
      </div>
    </section>

    <div class="task-list" id="taskList"></div>
  </main>

  <script>
    // App State
    let tasks = JSON.parse(localStorage.getItem('tm_tasks')) || [];
    let currentFilter = 'all';
    let currentTheme = localStorage.getItem('tm_theme') || 'dark';

    // DOM Elements
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const taskList = document.getElementById('taskList');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    // Stats Elements
    const statTotal = document.getElementById('statTotal');
    const statPending = document.getElementById('statPending');
    const statCompleted = document.getElementById('statCompleted');

    // Initialize Theme
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') {
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light';
      } else {
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark';
      }
      localStorage.setItem('tm_theme', theme);
    }
    applyTheme(currentTheme);

    themeToggleBtn.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(currentTheme);
    });

    // Save tasks to LocalStorage
    function saveTasks() {
      localStorage.setItem('tm_tasks', JSON.stringify(tasks));
      updateStats();
      renderTasks();
    }

    // Update Dashboard Metrics
    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const pending = total - completed;

      statTotal.textContent = total;
      statPending.textContent = pending;
      statCompleted.textContent = completed;
    }

    // Add Task
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      const newTask = {
        id: Date.now().toString(),
        text: text,
        priority: prioritySelect.value,
        completed: false,
        createdAt: new Date()
      };

      tasks.unshift(newTask);
      saveTasks();

      taskInput.value = '';
      prioritySelect.value = 'medium';
    });

    // Toggle Complete Status
    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
    }

    // Delete Task
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    // Filter Buttons Listener
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // Render Tasks to DOM
    function renderTasks() {
      const filteredTasks = tasks.filter(t => {
        if (currentFilter === 'pending') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <p>No tasks found.</p>
          </div>
        `;
        return;
      }

      taskList.innerHTML = filteredTasks.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}">
          <div class="task-left">
            <input 
              type="checkbox" 
              class="task-checkbox" 
              ${task.completed ? 'checked' : ''} 
              onchange="toggleTask('${task.id}')"
            >
            <span class="task-text">${escapeHtml(task.text)}</span>
            <span class="badge badge-${task.priority}">${task.priority}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask('${task.id}')" title="Delete Task">
            ✕
          </button>
        </div>
      `).join('');
    }

    // Helper: Escape HTML string
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    // Initial Render
    updateStats();
    renderTasks();
  </script>
</body>
</html>
